<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TKPrints — Impresión 3D</title>

    <!-- ─── SEO y vista previa al compartir ─────────────────────────────
         La descripción es la que usan Google y los bots de las redes cuando
         no hay nada mejor. Se escribió a partir del copy que ya existe en el
         sitio (HomeScreen y AboutScreen) para no inventar una voz distinta.

         SIGUEN FALTANDO a propósito canonical y og:url. Los dos dicen "esta
         página es ESTA dirección", y en una SPA el mismo HTML se sirve para
         todas las rutas: un canonical fijo le diría a Google que /producto/p01
         y /catalogo son en realidad la home. Mejor ninguno que uno mal.

         LIMITACIÓN: esto es una SPA. Los bots de Instagram, WhatsApp y
         Facebook NO ejecutan JavaScript, así que leen SOLO este archivo, que
         es el mismo para todas las rutas. La vista previa de cualquier link
         —la home o un producto— va a ser esta, genérica. Para tener una por
         producto hace falta que el HTML lo genere el servidor. -->
    <meta name="description" content="Impresión 3D de objetos funcionales y decorativos: lámparas, organizadores y gadgets diseñados y producidos en Buenos Aires. Cada pieza se imprime bajo pedido en nuestro taller." />

    <meta property="og:title" content="TKPrints — Impresión 3D" />
    <meta property="og:description" content="Objetos funcionales y decorativos impresos en 3D, diseñados y producidos en Buenos Aires. Cada pieza se imprime bajo pedido." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="TKPrints" />

    <!-- ─── La imagen de la vista previa ───────────────────────────────
         Tiene que ser una URL ABSOLUTA: los bots de WhatsApp, Instagram y
         Facebook no resuelven rutas relativas, porque leen el HTML fuera del
         contexto de la página. Es el único lugar del archivo donde el dominio
         está escrito, y por eso es lo primero que hay que cambiar si el sitio
         se muda.

         El archivo vive en public/assets/, que Vite copia a dist/assets/ —la
         misma carpeta donde pone sus bundles con hash— y que el rewrite de
         vercel.json ya excluye. Así no hay que tocar el patrón: el intento de
         agregarle una exclusión propia es lo que rompió el deploy anterior.

         width y height no son decoración: con ellos el chat puede reservar el
         lugar de la imagen antes de bajarla, y la tarjeta no salta cuando
         llega. -->
    <meta property="og:image" content="https://tkprints-catalog.vercel.app/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Logo de TKPrints sobre fondo azul oscuro" />

    <!-- summary_large_image y no summary: con og:image puesta, esta es la
         tarjeta que la muestra grande en vez de como miniatura al costado. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tkprints-catalog.vercel.app/assets/og-image.png" />

    <!-- El fondo real del sitio (--chalk). Tiñe la barra del navegador en
         Android y iOS para que no corte contra la página. Va uno solo: el
         tema oscuro está definido en index.css pero hoy nada lo activa, así
         que un theme-color oscuro prometería algo que el sitio no hace. -->
    <meta name="theme-color" content="#F8F7F4" />
    <!-- Favicon. Los archivos viven en public/, que Vite copia tal cual a la
         raíz del build, así que las rutas son las mismas en dev y en prod.
         El .ico va primero por los navegadores viejos que se quedan con el
         primero que entienden; los modernos prefieren el SVG, que se ve
         nítido en cualquier zoom y en pantallas retina. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sansation:wght@300;400;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
